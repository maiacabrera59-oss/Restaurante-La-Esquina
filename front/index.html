<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante La Esquina</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <p>La Esquina</p>
        <h2>Gestión de Pedidos</h2>
    </header>

    <nav>
        <a href="#nuevo-pedido">Nuevo Pedido</a>
        <a href="#pedidos">Pedidos tomados</a>
        <a href="#cuenta-mesa">Cuenta por Mesa</a>
    </nav>


    <div class="contenido-principal">

        <div class="container" id="nuevo-pedido">
            <h2>Registrar nuevo pedido</h2>

            <form id="form-pedido">

                <!-- MESA -->
                <div class="form-group">
                    <label for="mesa">Mesa</label>
                    <input type="number" id="mesa" min="1" placeholder="Número de mesa" required>
                </div>

                <!-- PLATO -->
                <div class="form-group">
                    <label for="idPlato">Plato</label>
                    <select id="idPlato" required>
                        <option value="" disabled selected>Seleccione un plato</option>
                    </select>
                </div>

          
                <div class="form-group">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" min="1" value="1" required>
                </div>

            
                <button type="submit">Tomar pedido</button>
            </form>
        </div>

        <div class="container" id="cuenta-mesa">
            <h2>Consultar Cuenta por Mesa</h2>

            <div class="form-group">
                <label for="mesa-cuenta">Número de Mesa</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="mesa-cuenta" min="1" placeholder="Ej: 3">
                    <button type="button" id="btn-consultar-cuenta">Ver Cuenta</button>
                </div>
            </div>

            <div id="resultado-cuenta" class="resultado-cuenta" style="margin-top: 15px;">
            </div>
        </div>


        <div class="container" id="pedidos">
            <h2>Pedidos tomados</h2>

      
            <div class="filtros">
                <button type="button" id="btn-todos">Todos</button>
                <button type="button" id="btn-en-curso">En curso</button>
            </div>

            <div id="lista-pedidos" class="lista-pedidos">
            </div>
        </div>

    </div>

    <footer>
        <p>© 2024 Restaurante La Esquina. Todos los derechos reservados.</p> 
    </footer>

    <script src="app.js"></script>
</body>
</html>
